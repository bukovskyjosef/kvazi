services:
  db:
    image: postgres:16-alpine
    container_name: kvazi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kvazi
      POSTGRES_USER: kvazi
      POSTGRES_PASSWORD: kvazi
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kvazi -d kvazi"]
      interval: 5s
      timeout: 5s
      retries: 10

  php:
    build: ./docker/php
    container_name: kvazi_php
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: kvazi
      DB_USER: kvazi
      DB_PASS: kvazi
    volumes:
      - ./app/public:/var/www/html:ro
      - ./app/data:/var/www/data:ro
    ports:
      - "8080:80"

volumes:
  db_data:
