name: Published release integrity
on: [pull_request]
jobs:
  releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node app/tools/check-releases.mjs
        env:
          KVAZI_RELEASE_BASE: ${{ github.event.pull_request.base.sha }}
