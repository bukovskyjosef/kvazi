name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Explicit bash enables pipefail, so tee cannot hide a failed mandatory runner.
defaults:
  run:
    shell: bash

jobs:
  gate:
    name: PR gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_ENV: development
      DB_NAME: kvazi
      DB_USER: kvazi
      DB_PASSWORD: kvazi
      AUTH_COOKIE_SECURE: '0'
      TRUSTED_PROXY_CIDRS: ''
      MAIL_TRANSPORT: outbox
      MAIL_FROM_ADDRESS: noreply@kvazi.test
      MAIL_FROM_NAME: Nejdelší kvazivěta
      MAIL_OUTBOX_PATH: /tmp/kvazi-mail-outbox.jsonl
      KVAZI_TEST_BASE_URL: http://127.0.0.1:8080
      PLAYWRIGHT_MODULE: ${{ github.workspace }}/.github/ci/node_modules/playwright/index.mjs
      KVAZI_RELEASE_BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify change risk
        id: risk
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            echo "Missing pull-request base ref" >&2
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          BASE="origin/$BASE_REF"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          if [ -z "$CHANGED" ]; then
            echo "level=low" >> "$GITHUB_OUTPUT"
            echo "No changed files — low risk"
            exit 0
          fi
          # Safe: documentation, markdown, issue/PR templates, LICENSE.
          # Everything else is risky (fail-safe: unknown path → full gate).
          RISKY=$(echo "$CHANGED" | grep -v -E '^(docs/|\.github/(ISSUE_TEMPLATE|PULL_REQUEST_TEMPLATE)/|.*\.md$|LICENSE$)' | head -1 || true)
          if [ -z "$RISKY" ]; then
            echo "level=low" >> "$GITHUB_OUTPUT"
            echo "Docs-only change — fast gate"
          else
            echo "level=full" >> "$GITHUB_OUTPUT"
            echo "Full gate required. First risky path: $RISKY"
            echo "All changed files:"
            echo "$CHANGED"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/ci/package-lock.json

      # --- Always: fast deterministic checks ---
      - name: Release integrity
        run: node app/tools/check-releases.mjs

      # --- Full gate: only when risky paths changed ---
      - name: Prepare PHP CLI and browser
        if: steps.risk.outputs.level == 'full'
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-pgsql php8.3-intl php8.3-mbstring
          sudo update-alternatives --set php /usr/bin/php8.3
          npm ci --prefix .github/ci --ignore-scripts
          .github/ci/node_modules/.bin/playwright install --with-deps chromium
          docker info > /dev/null
          docker compose version

      - name: Start disposable PostgreSQL 18 and application
        if: steps.risk.outputs.level == 'full'
        run: |
          docker compose up -d --build --wait --wait-timeout 120
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Run authoritative mandatory runner
        if: steps.risk.outputs.level == 'full'
        run: bash app/tests/run-integration.sh 2>&1 | tee release-gate.log

      - name: Save gate evidence
        if: always() && steps.risk.outputs.level == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-gate.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove disposable CI stack
        if: always() && steps.risk.outputs.level == 'full'
        run: docker compose down --volumes --remove-orphans
